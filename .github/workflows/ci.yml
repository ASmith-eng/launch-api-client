name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Mirrors the release gate so an artwork or asset change is caught while a
  # human is still reviewing the PR, rather than at tag time — when the
  # tempting "fix" is to regenerate, which would quietly bless a swapped image.
  splash-asset:
    name: Splash asset up to date
    runs-on: ubuntu-latest
    # Decodes an image through Pillow's C codecs; give it read access only.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned for the same reason as in release.yml: Pillow's LANCZOS output
      # defines the committed asset, so an unpinned bump fails this gate.
      - name: Install Pillow
        run: python3 -m pip install --quiet pillow==12.3.0

      - name: Check splash asset and source hash pin
        run: python3 tools/splash/build_splash_asset.py --check

  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format
        run: cargo fmt --check

      - name: Check
        run: cargo check --locked

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy -- -D warnings
