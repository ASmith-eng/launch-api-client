[package]
name = "launch-client"
version = "1.2.1"
edition = "2021"
description = "Terminal UI for browsing upcoming space launches via Launch Library 2"
license = "MIT"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
crossterm = { version = "0.28", features = ["event-stream"] }
directories = "6"
futures = "0.3"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
wiremock = "0.6"
